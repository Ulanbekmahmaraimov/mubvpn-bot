name: mubvpn
description: mubVPN - Secure VPN Application
publish_to: 'none'
version: 1.0.6+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  flutter_secure_storage: ^9.0.0
  purchases_flutter: ^8.1.1
  http: ^1.2.0
  csv: ^6.0.0
  google_mobile_ads: ^5.1.0
  installed_apps: ^1.0.1
  url_launcher: ^6.2.5
  window_manager: ^0.4.3
  path_provider: ^2.1.3
  
  # Firebase
  firebase_core: ^3.10.1
  firebase_database: ^11.3.1
  firebase_auth: ^5.4.1
  
  # VPN Protocols
  flutter_v2ray: ^1.0.10
  google_sign_in: ^6.2.1
  device_info_plus: ^12.4.0
  google_generative_ai: 0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
